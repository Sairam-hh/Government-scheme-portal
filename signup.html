<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account — Government Scheme Portal</title>
    <meta name="description" content="Create a free citizen account to save schemes, store eligibility results and track applications." />
    <meta property="og:title" content="Create Account — Government Scheme Portal" />
    <meta property="og:description" content="Create a free citizen account to save schemes, store eligibility results and track applications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>

        :root {
            --cream: #F7F1E3;
            --warm-ivory: #FBF8F0;
            --light-cream: #EFE5D2;
            --soft-beige: #D8C8AE;

            --brown: #6B4226;
            --rich-brown: #4A2C1A;
            --dark-brown: #2A1910;
            --coffee: #382116;

            --gold-brown: #A77B4F;

            --text-dark: #2B211B;
            --text-muted: #786B60;

            --white: #FFFDF8;

            --border: rgba(74, 44, 26, 0.18);
            --glass: rgba(255, 253, 248, 0.72);

            --shadow-sm: 0 2px 10px rgba(42, 25, 16, 0.06);
            --shadow-md: 0 14px 34px rgba(42, 25, 16, 0.12);
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--warm-ivory);
            color: var(--text-dark);
            font-family: 'Manrope', 'Inter', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 600;
            line-height: 1.15;
            color: var(--rich-brown);
            letter-spacing: -0.01em;
        }

        h1 { font-size: clamp(2.2rem, 5vw, 4rem); }
        h2 { font-size: clamp(1.8rem, 3.6vw, 2.9rem); }
        h3 { font-size: clamp(1.15rem, 2vw, 1.45rem); }

        p { color: var(--text-muted); }

        ::selection {
            background: var(--brown);
            color: var(--cream);
        }

        .container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold-brown);
            margin-bottom: 18px;
            border-left: 3px solid var(--gold-brown);
            padding-left: 12px;
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 0;
            border: 1px solid var(--rich-brown);
            background: var(--rich-brown);
            color: var(--cream);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 15px 30px;
            cursor: pointer;
            overflow: hidden;
            transition: color 0.35s var(--ease), transform 0.35s var(--ease),
                        background 0.35s var(--ease), border-color 0.35s var(--ease);
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--cream);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--ease);
            z-index: 0;
        }

        .btn span,
        .btn i {
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            color: var(--rich-brown);
            transform: translateY(-3px);
        }

        .btn:hover::after {
            transform: scaleX(1);
        }

        .btn--block {
            width: 100%;
        }

        .link-arrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--brown);
            transition: gap 0.3s var(--ease), color 0.3s var(--ease);
        }

        .link-arrow:hover {
            gap: 18px;
            color: var(--dark-brown);
        }

        /* Back-to-home link (top of the auth card) */
        .back-home {
            margin-bottom: 28px;
            padding: 8px 0;
        }

        .back-home i {
            transition: transform 0.35s var(--ease);
        }

        .back-home:hover i {
            transform: translateX(-6px);
        }

        .back-home:hover {
            gap: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--rich-brown);
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border-radius: 0;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 14px 16px;
            transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease),
                        background 0.3s var(--ease);
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: var(--gold-brown);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--rich-brown);
            box-shadow: 0 0 0 4px rgba(107, 66, 38, 0.12);
            background: var(--warm-ivory);
        }

        .error-text {
            display: block;
            min-height: 18px;
            font-size: 0.78rem;
            color: #9B2C1A;
            margin-top: 6px;
        }

        .checkline {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .checkline input {
            width: 16px;
            height: 16px;
            margin-top: 4px;
            accent-color: var(--brown);
        }

        .logo {
        height: 60px; /* navbar lo space same ga untundi */
        display: flex;
        align-items: center;
        gap: 12px;}

        .logo img {
            height: 80px;
            width: auto;
            transform: scale(1.8);
            transform-origin: center;
        }

        .auth-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        .auth-visual {
            position: relative;
            overflow: hidden;
            background: var(--dark-brown);
            display: flex;
            align-items: flex-end;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .auth-visual img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.45;
        }

        .auth-visual-body {
            position: relative;
            z-index: 2;
            padding: 56px;
        }

        .auth-visual-body h2 {
            color: var(--cream);
            max-width: 460px;
        }

        .auth-visual-body p {
            color: rgba(247, 241, 227, 0.75);
            max-width: 460px;
            margin-top: 16px;
        }

        .auth-form-side {
            background: var(--warm-ivory);
            padding: 40px 48px 64px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .auth-inner {
            max-width: 460px;
            margin: 0 auto;
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-btn {
            border-radius: 0;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--rich-brown);
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 16px;
            cursor: pointer;
            transition: background 0.3s var(--ease), color 0.3s var(--ease),
                        transform 0.3s var(--ease), border-color 0.3s var(--ease);
        }

        .role-btn:hover {
            transform: translateY(-3px);
            border-color: var(--rich-brown);
        }

        .role-btn.active {
            background: var(--dark-brown);
            border-color: var(--dark-brown);
            color: var(--cream);
        }

        .auth-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .auth-row a {
            font-size: 0.85rem;
            color: var(--brown);
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s var(--ease);
        }

        .auth-row a:hover { border-color: var(--brown); }

        .social-auth {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .social-auth a {
            display: grid;
            place-items: center;
            padding: 14px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--rich-brown);
            border-radius: 0;
            transition: background 0.3s var(--ease), color 0.3s var(--ease),
                        transform 0.3s var(--ease);
        }

        .social-auth a:hover {
            background: var(--rich-brown);
            color: var(--cream);
            transform: translateY(-3px);
        }

        .rule {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 28px 0 4px;
            color: var(--text-muted);
            font-size: 0.74rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .rule::before,
        .rule::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        @media (max-width: 900px) {
            .auth-wrap { grid-template-columns: 1fr; }
            .auth-visual { height: 320px; position: relative; }
            .auth-visual-body { padding: 28px; }
            .auth-form-side { max-height: none; padding: 32px 20px 56px; }
            .back-home { margin-bottom: 20px; }
        }

        @media (max-width: 480px) {
            .back-home { font-size: 0.7rem; gap: 8px; }
            .back-home:hover { gap: 12px; }
        }

    </style>
</head>

<body>
    <main class="auth-wrap">
        <section class="auth-visual">
            <img src="./images/auth.webp" alt="Government building corridor" width="1200" height="1600" />
            <div class="auth-visual-body">
                <span class="eyebrow">Join The Portal</span>
                <h2>Create Your Citizen Account</h2>
                <p>
                    Save schemes, store eligibility results and receive updates relevant to
                    your state and household profile.
                </p>
            </div>
        </section>

        <section class="auth-form-side">
            <div class="auth-inner">

                <a class="link-arrow back-home" href="index.html">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>Go Home</span>
                </a>

                <div style="margin-bottom: 36px;">
                    <a class="logo" href="index.html" aria-label="Government Scheme Portal home">
                <img src="./images/stackly-logo-goldbrown.webp" alt="Government Scheme Portal" width="100" height="100">
                
            </a>
            </div>

                <span class="eyebrow">Signup</span>
                <h1 style="font-size: clamp(1.9rem, 3vw, 2.4rem);">Create Account</h1>
                <p style="margin-top: 12px;">It takes less than a minute.</p>

                <form id="signupForm" style="margin-top: 32px;" novalidate>
                    <div class="field">
                        <label>Role</label>
                        <div class="role-grid">
                            <button class="role-btn active" type="button" data-role="Citizen" aria-pressed="true">Citizen</button>
                            <button class="role-btn" type="button" data-role="Admin" aria-pressed="false">Admin</button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="sName">Full Name</label>
                        <input type="text" id="sName" placeholder="John Kumar" autocomplete="name" />
                        <span class="error-text" id="errName"></span>
                    </div>

                    <div class="field">
                        <label for="sEmail">Email</label>
                        <input type="email" id="sEmail" placeholder="you@example.com" autocomplete="email" />
                        <span class="error-text" id="errEmail"></span>
                    </div>

                    <div class="field">
                        <label for="sPassword">Password</label>
                        <input type="password" id="sPassword" placeholder="Minimum 6 characters" autocomplete="new-password" />
                        <span class="error-text" id="errPassword"></span>
                    </div>

                    <div class="field">
                        <label for="sConfirm">Confirm Password</label>
                        <input type="password" id="sConfirm" placeholder="Re-enter password" autocomplete="new-password" />
                        <span class="error-text" id="errConfirm"></span>
                    </div>

                    <div class="field">
                        <label class="checkline" style="letter-spacing: 0; text-transform: none; font-weight: 500;">
                            <input type="checkbox" id="sTerms" /> I agree to the Terms &amp; Conditions and Privacy Policy.
                        </label>
                        <span class="error-text" id="errTerms"></span>
                    </div>

                    <button class="btn btn--block" type="submit"><span>Create Account</span></button>
                </form>

                <div class="rule">Or sign up with</div>
                <div class="social-auth">
                    <a href="404.html" aria-label="Sign up with Google"><i class="fa-brands fa-google"></i></a>
                    <a href="404.html" aria-label="Sign up with Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="404.html" aria-label="Sign up with LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>

                <div class="auth-row" style="margin-top: 28px;">
                    <span style="font-size: 0.9rem; color: var(--text-muted);">Already registered? <a href="login.html">Login</a></span>
                </div>
            </div>
        </section>
    </main>


    <script>
        /* ---------- ROLE SELECTOR ---------- */
        var selectedRole = 'Citizen';

        (function initRoles() {
            var buttons = document.querySelectorAll('.role-btn');

            buttons.forEach(function (button) {
                button.addEventListener('click', function () {
                    buttons.forEach(function (item) { item.classList.remove('active'); });
                    button.classList.add('active');
                    button.setAttribute('aria-pressed', 'true');
                    selectedRole = button.dataset.role;
                });
            });
        })();

        var EMAIL_RE = /^[^\s@]+@[^\s@]+\.(com|in|org)$/i;
        var NAME_RE = /^[A-Za-z ]+$/;

        function setError(id, message) {
            document.getElementById(id).textContent = message;
            return !message;
        }

        function displayNameFromEmail(email) {
            return email.split('@')[0]
                .split(/[._-]+/)
                .filter(Boolean)
                .map(function (part) { return part.charAt(0).toUpperCase() + part.slice(1); })
                .join(' ');
        }

        /* ---------- SIGNUP VALIDATION ---------- */
        (function initSignup() {
            var form = document.getElementById('signupForm');

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                var name = document.getElementById('sName').value.trim();
                var email = document.getElementById('sEmail').value.trim();
                var password = document.getElementById('sPassword').value;
                var confirm = document.getElementById('sConfirm').value;
                var terms = document.getElementById('sTerms').checked;
                var valid = true;

                valid = setError('errName',
                    !name ? 'Full name is required.'
                        : !NAME_RE.test(name) ? 'Name may contain only alphabets and spaces.' : '') && valid;

                valid = setError('errEmail',
                    !email ? 'Email is required.'
                        : !EMAIL_RE.test(email) ? 'Please enter a valid email ending with .com, .in or .org.' : '') && valid;

                valid = setError('errPassword',
                    !password ? 'Password is required.'
                        : password.length < 6 ? 'Password must be at least 6 characters.' : '') && valid;

                valid = setError('errConfirm',
                    !confirm ? 'Please confirm your password.'
                        : confirm !== password ? 'Passwords do not match.' : '') && valid;

                valid = setError('errTerms', !terms ? 'You must accept the Terms & Conditions.' : '') && valid;

                if (!valid) { return; }

                localStorage.setItem('role', selectedRole);
                localStorage.setItem('email', email);
                localStorage.setItem('name', name);

                window.location.href = 'login.html';
            });
        })();

    </script>
</body>

</html>
